services:
  - type: web
    name: petrolq-api
    env: python
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    startCommand: "python run_server.py"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
